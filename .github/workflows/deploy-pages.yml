name: Deploy juxtacrop to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build static site
        shell: bash
        run: |
          mkdir -p _site/demo

          rsync -a web/ _site/ \
            --exclude README.md \
            --exclude package.json \
            --exclude server.mjs \
            --exclude scripts \
            --exclude tests

          cp index.html _site/demo/index.html
          cp -R css js assets _site/demo/

          touch _site/.nojekyll
          printf '%s\n' 'juxtacrop.earth' > _site/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
